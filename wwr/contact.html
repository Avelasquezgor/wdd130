<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Page</title>
    <meta name="description"
      content="Receive more information about our rafting services and also let us know for any doubt.">
    <meta name="author" content="Ana Lucia Velasquez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting_logo.jpg" alt="Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Fun Adventure</h1>
        <address>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>
                <a href="tel:+1 999 999 9999">+1 999 999 9999</a>
            </p>
            <p>
                <a href="mailto:crazyrafting@gmail.com">crazyrafting@gmail.com</a>
            </p>
        </address>

        <!-- 1. SECCIÓN MAPA Y FORMULARIO (Únicamente ellos dos dentro) -->
        <section class="map-form-container">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15755.241277315487!2d-79.41435439973122!3d9.17157661860477!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2spa!4v1791206660067!5m2!1ses-419!2spa"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <p class="form-heading">Purpose of Message</p>
                <div>
                    <input type="radio" name="purpose" id="general" value="general">
                    <label for="general">General Inquiry</label>
                </div>
                <div>
                    <input type="radio" name="purpose" id="reservation" value="reservation">
                    <label for="reservation">Reservation Question</label>
                </div>
                <div>
                    <input type="radio" name="purpose" id="suggestion" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </div>
                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <div>
                    <input type="checkbox" name="newsletter" id="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>
                <div>
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </section> <!-- Aquí cierra map-form-container -->

        <!-- 2. SECCIÓN DE EMPLEADOS (Fuera del grid de mapa/formulario) -->
        <h2>We are Here to Serve You</h2>
        <section class="employees-grid">
            <figure>
                <img src="images/general_manager.jpg" alt="Mario Mendez">
                <figcaption>Mario Mendez - General Manager</figcaption>
            </figure>
            <figure>
                <img src="images/site_manager.jpg" alt="John Sans">
                <figcaption>John Sans - Site Manager</figcaption>
            </figure>
            <figure>
                <img src="images/site_supervisor.jpg" alt="Jorge Owens">
                <figcaption>Jorge Owens - Site Supervisor</figcaption>
            </figure>
        </section>

    </main>
    <footer>
        <p>©2026 //Fun Adventure//Ana Lucia Velasquez</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com" target="_blank">
                <img src="images/instagram_logo.png" alt="Instagram Icon"></a>
            <a href="https://www.tiktok.com" target="_blank">
                <img src="images/tiktok_logo.png" alt="Tiktok Icon"></a>
            <a href="https://www.facebook.com">
                <img src="images/facebook_logo.png" alt="Facebook Icon"></a>
        </nav>
    </footer>
</body>

</html>
